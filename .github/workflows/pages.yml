name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a broken build can be redeployed without an empty commit.
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a half-finished
# publish leaves the site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is tsc --noEmit && vite build, so a type error fails
      # the deploy rather than shipping a broken page.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
