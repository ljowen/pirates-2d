name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a migration half-applied under a new build is worse
# than waiting.
concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecks the game and the server, then builds with the open sea on.
      - run: npm run build:sea
      - run: npm run arena
      - run: npx wrangler d1 migrations apply pirates-2d --remote
      - run: npx wrangler deploy
